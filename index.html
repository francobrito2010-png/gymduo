<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymDuo" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <title>GymDuo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- datos y lógica -->
  <script src="firebase.js"></script>
  <script src="exercises.js" defer></script>
  <script src="geometry.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="sync.js" defer></script>

  <!-- Firebase opcional (solo se activa si pones credenciales en firebase.js) -->
  <script type="module">
    const cfg = window.FIREBASE_CONFIG
    const filled = cfg && cfg.apiKey && !String(cfg.apiKey).startsWith('PON_AQUI')
    if (!filled) { window.__gymFirebaseNone = true }
    else {
      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js')
        const { getFirestore, collection, doc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
        const app = initializeApp(cfg); const db = getFirestore(app)
        window.__gymFirebaseDriver = {
          write(coll, id, data) { setDoc(doc(db, coll, String(id)), data).catch(() => {}) },
          subscribeAll(merge) {
            ;['profiles', 'workouts', 'body'].forEach(c => {
              onSnapshot(collection(db, c), snap => {
                const docs = []; snap.forEach(d => { const o = d.data() || {}; o.id = d.id; docs.push(o) }); merge(c, docs)
              }, () => {})
            })
          }
        }
      } catch (e) { window.__gymFirebaseNone = true }
    }
  </script>

  <!-- app (se carga la última) -->
  <script src="app.js" defer></script>

  <!-- service worker (offline) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))
    }
  </script>
</body>
</html>
